<div class="form-box">

    <div class="user-icon">
        ♙
    </div>

    <h2>
        Iniciar sesión
    </h2>


    <label>
        Usuario
    </label>

    <input
        id="usuario"
        type="text"
        placeholder="Usuario">


    <label>
        Contraseña
    </label>

    <input
        id="clave"
        type="password"
        placeholder="Contraseña">


    <button onclick="entrar()">
        Ingresar
    </button>


    <div class="links">

        <a href="registro.html">
            ¿No tienes una cuenta?
            Regístrate
        </a>

    </div>

</div>

    © 2026 Proyecto Integrador BMW

</footer>


<script>

function entrar() {

    let usuario =
        document.getElementById("usuario").value;

    let clave =
        document.getElementById("clave").value;


    if (usuario === "" || clave === "") {

        alert(
            "Completa todos los campos."
        );

    } else {

        alert(
            "Inicio de sesión correcto."
        );

    }

}

</script>
