<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes BMW</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.0/css/bulma.min.css">
</head>

<body>
    <nav class="navbar" role="navigation" aria-label="main navigation">
        <div class="navbar-brand"> <a class="navbar-item">
                <p class="title is-3 is-spaced">clientes</p>
            </a> </div>
        <div class="navbar-end">
            <div class="navbar-item">
                <div class="buttons"> <a class="button is-primary" href="../index.html"> <strong>home</strong> </a>
                </div>
            </div>
        </div>
    </nav>
    <section class="section">
        <div class="container">
            <div class="columns is-centered">
                <div class="column is-6">
                    <div class="box">
                        <h1 class="title has-text-centered"> Registro de Clientes </h1>
                        <div>
                            <div class="field"> <label class="label">Nombre Completo</label>
                                <div class="control"> <input class="input" type="text" name="nombre_cliente"
                                        placeholder="Ingrese el nombre" id="nombre_cliente"> </div>
                            </div>
                            <div class="field"> <label class="label">Documento</label>
                                <div class="control"> <input class="input" type="text" name="documento_cliente"
                                        placeholder="Ingrese el documento" id="documento_cliente"> </div>
                            </div>
                            <div class="field"> <label class="label">Teléfono</label>
                                <div class="control"> <input class="input" type="tel" name="telefono_cliente"
                                        placeholder="Ingrese el teléfono" id="telefono_cliente"> </div>
                            </div>
                            <div class="field"> <label class="label">Correo Electrónico</label>
                                <div class="control"> <input class="input" type="email" name="correo_cliente"
                                        placeholder="Ingrese el correo" id="correo_cliente"> </div>
                            </div>
                            <div class="field"> <label class="label">Dirección</label>
                                <div class="control"> <input class="input" type="text" name="direccion_cliente"
                                        placeholder="Ingrese la dirección" id="direccion_cliente"> </div>
                            </div>
                            <div class="field"> <label class="label">Ciudad</label>
                                <div class="control"> <input class="input" type="text" name="ciudad_cliente"
                                        placeholder="Ingrese la ciudad" id="ciudad_cliente"> </div>
                            </div>
                            <div class="field"> <label class="label">Vehículo de Interés</label>
                                <div class="control"> <input class="input" type="text" name="vehiculo_interes"
                                        placeholder="Ingrese el vehículo de interés" id="vehiculo_interes"> </div>
                            </div>
                            <div class="field mt-5">
                                <div class="control"> <button class="button is-primary is-fullwidth" id="btnGuardar">
                                        Guardar Cliente </button> </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../js/clientes.js"></script>
</body>

</html>
