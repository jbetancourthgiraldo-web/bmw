<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servicios BMW</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.0/css/bulma.min.css">
</head>

<body>
    <nav class="navbar" role="navigation" aria-label="main navigation">
        <div class="navbar-brand"> <a class="navbar-item">
                <p class="title is-3 is-spaced">servicios</p>
            </a> </div>
        <div class="navbar-end">
            <div class="navbar-item">
                <div class="buttons"> <a class="button is-primary" href="../index.html"> <strong>home</strong> </a>
                </div>
            </div>
        </div>
    </nav>
    <section class="section">
        <div class="container">
            <div class="columns is-centered">
                <div class="column is-6">
                    <div class="box">
                        <h1 class="title has-text-centered"> Registro de Servicios </h1>
                        <div>
                            <div class="field"> <label class="label">Nombre del Cliente</label>
                                <div class="control"> <input class="input" type="text" name="nombre_cliente"
                                        placeholder="Ingrese el nombre" id="nombre_cliente"> </div>
                            </div>
                            <div class="field"> <label class="label">Vehículo</label>
                                <div class="control"> <input class="input" type="text" name="vehiculo_servicio"
                                        placeholder="Ingrese el vehículo" id="vehiculo_servicio"> </div>
                            </div>
                            <div class="field"> <label class="label">Tipo de Servicio</label>
                                <div class="control">
                                    <div class="select is-fullwidth"> <select name="tipo_servicio" id="tipo_servicio">
                                            <option value="">Seleccione un servicio</option>
                                            <option value="mantenimiento">Mantenimiento</option>
                                            <option value="revision">Revisión</option>
                                            <option value="diagnostico">Diagnóstico</option>
                                            <option value="reparacion">Reparación</option>
                                            <option value="cambio_aceite">Cambio de aceite</option>
                                        </select> </div>
                                </div>
                            </div>
                            <div class="field"> <label class="label">Fecha del Servicio</label>
                                <div class="control"> <input class="input" type="date" name="fecha_servicio"
                                        id="fecha_servicio"> </div>
                            </div>
                            <div class="field"> <label class="label">Precio</label>
                                <div class="control"> <input class="input" type="number" step="0.01"
                                        name="precio_servicio" placeholder="Ingrese el precio" id="precio_servicio">
                                </div>
                            </div>
                            <div class="field"> <label class="label">Descripción</label>
                                <div class="control"> <textarea class="textarea" name="descripcion_servicio"
                                        placeholder="Ingrese una descripción del servicio" id="descripcion_servicio"
                                        rows="2"></textarea> </div>
                            </div>
                            <div class="field"> <label class="label">Estado</label>
                                <div class="control">
                                    <div class="select is-fullwidth"> <select name="estado_servicio"
                                            id="estado_servicio">
                                            <option value="">Seleccione un estado</option>
                                            <option value="pendiente">Pendiente</option>
                                            <option value="proceso">En proceso</option>
                                            <option value="finalizado">Finalizado</option>
                                        </select> </div>
                                </div>
                            </div>
                            <div class="field mt-5">
                                <div class="control"> <button class="button is-primary is-fullwidth" id="btnGuardar">
                                        Guardar Servicio </button> </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../js/servicios.js"></script>
</body>

</html>
