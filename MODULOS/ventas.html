<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ventas BMW</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.0/css/bulma.min.css">
</head>

<body>
    <nav class="navbar" role="navigation" aria-label="main navigation">
        <div class="navbar-brand"> <a class="navbar-item">
                <p class="title is-3 is-spaced">ventas</p>
            </a> </div>
        <div class="navbar-end">
            <div class="navbar-item">
                <div class="buttons"> <a class="button is-primary" href="../index.html"> <strong>home</strong> </a>
                </div>
            </div>
        </div>
    </nav>
    <section class="section">
        <div class="container">
            <div class="columns is-centered">
                <div class="column is-6">
                    <div class="box">
                        <h1 class="title has-text-centered"> Registro de Ventas </h1>
                        <div>
                            <div class="field"> <label class="label">Cliente</label>
                                <div class="control"> <input class="input" type="text" name="cliente_venta"
                                        placeholder="Ingrese el cliente" id="cliente_venta"> </div>
                            </div>
                            <div class="field"> <label class="label">Vehículo</label>
                                <div class="control"> <input class="input" type="text" name="vehiculo_venta"
                                        placeholder="Ingrese el vehículo" id="vehiculo_venta"> </div>
                            </div>
                            <div class="field"> <label class="label">Vendedor</label>
                                <div class="control"> <input class="input" type="text" name="vendedor_venta"
                                        placeholder="Ingrese el vendedor" id="vendedor_venta"> </div>
                            </div>
                            <div class="field"> <label class="label">Precio de Venta</label>
                                <div class="control"> <input class="input" type="number" step="0.01" name="precio_venta"
                                        placeholder="Ingrese el precio" id="precio_venta"> </div>
                            </div>
                            <div class="field"> <label class="label">Método de Pago</label>
                                <div class="control">
                                    <div class="select is-fullwidth"> <select name="metodo_pago" id="metodo_pago">
                                            <option value="">Seleccione un método</option>
                                            <option value="efectivo">Efectivo</option>
                                            <option value="tarjeta">Tarjeta</option>
                                            <option value="transferencia">Transferencia</option>
                                            <option value="credito">Crédito</option>
                                        </select> </div>
                                </div>
                            </div>
                            <div class="field"> <label class="label">Fecha de Venta</label>
                                <div class="control"> <input class="input" type="date" name="fecha_venta"
                                        id="fecha_venta"> </div>
                            </div>
                            <div class="field"> <label class="label">Observaciones</label>
                                <div class="control"> <textarea class="textarea" name="observaciones_venta"
                                        placeholder="Ingrese observaciones" id="observaciones_venta"
                                        rows="2"></textarea> </div>
                            </div>
                            <div class="field mt-5">
                                <div class="control"> <button class="button is-primary is-fullwidth" id="btnGuardar">
                                        Guardar Venta </button> </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../js/ventas.js"></script>
</body>

</html>
